services:
  postgres:
    image: postgres:16-alpine
    container_name: herasat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: herasat_db
      POSTGRES_USER: herasat_user
      POSTGRES_PASSWORD: ${HERASAT_DB_PASSWORD:?err}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - herasat_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro

volumes:
  herasat_pgdata:
